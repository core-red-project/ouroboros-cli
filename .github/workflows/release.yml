name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag matches obfusku.toml and the version text
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          manifest="$(sed -n 's/^version *= *"\(.*\)"/\1/p' obfusku.toml | head -1)"
          text="$(grep -o '"ouroboros [0-9][^"]*"' src/cli.obk | head -1 | tr -d '"' | cut -d' ' -f2)"
          [ "$manifest" = "$version" ] || { echo "::error::obfusku.toml has $manifest, tag is $version"; exit 1; }
          [ "$text" = "$version" ] || { echo "::error::src/cli.obk prints $text, tag is $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Tag commit is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"

  build:
    name: Build (${{ matrix.suffix }})
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, suffix: linux-x86_64, ext: "" }
          - { os: macos-15, suffix: macos-aarch64, ext: "" }
          - { os: windows-2025, suffix: windows-x86_64, ext: ".exe" }
    env:
      OBFUSKU_VERSION: "1.1.0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install just
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: just@1.57.0
      - name: Install obfusku
        run: |
          curl -fsSL "https://raw.githubusercontent.com/core-red-project/obfusku/v${OBFUSKU_VERSION}/install.sh" | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: just install
      - run: just check
      - name: Bundle
        env:
          OUT: ouroboros-${{ matrix.suffix }}${{ matrix.ext }}
        run: |
          set -euo pipefail
          mkdir -p dist
          obfusku bundle . -o "dist/$OUT"
          "./dist/$OUT" --version
          "./dist/$OUT" factorial 20 | grep -qx 2432902008176640000
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.suffix }}
          path: dist/*
          retention-days: 1

  publish:
    name: Publish
    needs: [verify-version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and release notes
        env:
          VERSION: ${{ needs.verify-version.outputs.version }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum * > SHA256SUMS)
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && (/^## \[/ || /^---$/) {exit} on' CHANGELOG.md > RELEASE_NOTES.md
          [ -s RELEASE_NOTES.md ] || { echo "::error::CHANGELOG.md has no [$VERSION] section"; exit 1; }
      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          body_path: RELEASE_NOTES.md
