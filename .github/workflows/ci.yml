name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate commit messages
        env:
          BASE: origin/${{ github.base_ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-commit-range.sh "$BASE" "$HEAD"

  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    env:
      # The first obfusku release with `test`, `fmt --check|--write` and
      # manifest format 2; this workflow cannot pass against an older one.
      OBFUSKU_VERSION: "1.1.0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install just
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: just@1.57.0
      - name: Install obfusku (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL "https://raw.githubusercontent.com/core-red-project/obfusku/v${OBFUSKU_VERSION}/install.sh" | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install obfusku (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm "https://raw.githubusercontent.com/core-red-project/obfusku/v$env:OBFUSKU_VERSION/install.ps1" | iex
          echo "$HOME\.local\bin" >> $env:GITHUB_PATH
      - run: just install
      - run: just check
